[package]
name = "norn"
version = "0.1.0"
edition = "2021"
description = "A terminal IRCv3 client built on the norn engine."

[[bin]]
name = "norn"
path = "src/main.rs"

[dependencies]
irc-proto = { path = "../irc-proto" }
irc-engine = { path = "../irc-engine" }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
