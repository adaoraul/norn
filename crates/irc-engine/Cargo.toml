[package]
name = "irc-engine"
version = "0.1.0"
edition = "2021"
authors = ["Adao Raul <adao.raul@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Async IRCv3 engine: connection, TLS, bring-up machines, batch/label routing, CHATHISTORY, event emission."

[dependencies]
irc-proto = { path = "../irc-proto" }
tokio = { version = "1", features = ["io-util", "rt", "macros", "net", "time", "sync"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
