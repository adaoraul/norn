[package]
name = "irc-proto"
version = "0.1.0"
edition = "2021"
description = "Pure, synchronous IRCv3 protocol core: codec, cap parsing, SASL math. No I/O, no async."

[dependencies]
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
base64 = "0.22"

[dev-dependencies]
proptest = "1"
